server.port=8080

# MongoDB Configuration (URI din variabilă de mediu MONGODB_URI sau fallback localhost)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/gangstyle}

# Security & JWT Configuration (din variabilă de mediu JWT_SECRET sau fallback dev)
gangstyle.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
gangstyle.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Two-Factor Authentication (TOTP RFC 6238) rate limit configuration
gangstyle.security.2fa.max-attempts=5
gangstyle.security.2fa.lockout-seconds=300

# Email SMTP Configuration (Gmail sau oricare alt server SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Expeditor afișat în email
gangstyle.mail.from=${MAIL_FROM:Gang Style Barbershop <gangstylegiurgiu@gmail.com>}

# Logging
logging.level.ro.gangstyle=DEBUG
